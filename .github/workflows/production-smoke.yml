name: Production smoke

on:
  repository_dispatch:
    types:
      - vercel.deployment.success

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install smoke-check dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Check immutable production deployment
        working-directory: web
        env:
          BASE_URL: ${{ github.event.client_payload.url }}
          DEPLOYMENT_ID: ${{ github.event.client_payload.id }}
          PROJECT_ID: ${{ github.event.client_payload.project.id }}
          GIT_SHA: ${{ github.event.client_payload.git.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_CHECK_SECRET: ${{ secrets.DEPLOY_CHECK_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/production-smoke.mjs
